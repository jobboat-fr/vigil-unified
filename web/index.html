<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
    />
    <!-- Le SVG d'abord (net à tout zoom, et le seul à jour) ; le PNG reste pour les
         navigateurs qui ignorent les icônes vectorielles. `mask-icon` exige un SVG
         monochrome : il pointait sur un PNG, donc Safari l'ignorait silencieusement. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="mask-icon" href="/vtlvs-mark.svg" color="#0b2239" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>VTLVS — plateforme de formation</title>
    <meta
      name="description"
      content="Planning, émargement, qualité et coffre-fort documentaire pour organismes de formation certifiés Qualiopi."
    />
    <meta name="theme-color" content="#0f2159" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://app.vtlvs.com/" />

    <!-- PWA + mobile: installable on Android/iOS, matches the Capacitor shell -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VTLVS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph (aperçus de lien).
         Tout ce bloc décrivait VIGIL : un bureau de trading crypto, ses offres, sa FAQ sur
         les plafonds de NAV. C'était l'identité du produit dont VTLVS est issu, restée en
         place après la bascule — si bien que tout lien vers app.vtlvs.com s'affichait,
         dans un message, comme une carte de trading en anglais. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VTLVS" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="VTLVS — la formation, prouvée en temps réel" />
    <meta
      property="og:description"
      content="La plateforme des organismes de formation : émargement scellé, dossier Qualiopi tenu en continu, signature électronique, coffre documentaire et agents IA sous identité vérifiée."
    />
    <meta property="og:url" content="https://app.vtlvs.com/" />
    <meta property="og:image" content="https://app.vtlvs.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VTLVS — la formation, prouvée en temps réel" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VTLVS — la formation, prouvée en temps réel" />
    <meta
      name="twitter:description"
      content="Émargement scellé, dossier Qualiopi continu, signature électronique et agents IA sous identité vérifiée, pour les organismes de formation."
    />
    <meta name="twitter:image" content="https://app.vtlvs.com/og.png" />

    <!-- Données structurées : l'éditeur, et l'application telle qu'elle est.
         On ne déclare que ce qui est vrai et visible : pas de tarifs inventés, pas de FAQ
         qui décrit un autre produit. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "AZZ&CO LABS",
            "legalName": "AZZ&CO LABS",
            "email": "rached.azer@azzcolabs.business",
            "url": "https://vtlvs.com/",
            "logo": "https://app.vtlvs.com/icon-512.png",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Bâtiment Fougères, rue de Guyenne",
              "postalCode": "78840",
              "addressLocality": "Freneuse",
              "addressCountry": "FR"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "VTLVS",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Gestion d'organisme de formation",
            "operatingSystem": "Navigateur web",
            "url": "https://app.vtlvs.com/",
            "inLanguage": "fr-FR",
            "description": "Plateforme des organismes de formation : sessions, inscriptions, émargement scellé, signature électronique, coffre documentaire, dossier Qualiopi tenu en continu et agents IA sous identité vérifiée.",
            "publisher": { "@type": "Organization", "name": "AZZ&CO LABS" },
            "featureList": [
              "Émargement scellé et vérifiable",
              "Signature électronique des documents de formation",
              "Dossier Qualiopi tenu en continu",
              "Coffre documentaire par organisme",
              "Salle de formation à distance",
              "Agents IA sous identité et rôle vérifiés"
            ]
          },
          {
            "@type": "WebSite",
            "name": "VTLVS",
            "url": "https://app.vtlvs.com/",
            "inLanguage": "fr-FR"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:760px;margin:0 auto;padding:2rem;font-family:system-ui,sans-serif;color:#0b2239;background:#f4f7fb">
        <h1>VTLVS — la formation, prouvée en temps réel</h1>
        <p>VTLVS est la plateforme des organismes de formation : elle tient les sessions, les inscriptions, l'émargement, les signatures, le coffre documentaire et le dossier Qualiopi — et elle fabrique la preuve pendant le travail, plutôt que de la reconstituer avant un audit.</p>
        <h2>Ce qu'elle tient</h2>
        <ul>
          <li><strong>Émargement scellé</strong> — signé à l'heure du serveur, chaîné, non modifiable après coup.</li>
          <li><strong>Signature électronique</strong> — règlement intérieur, convention, protocole individuel, horodatés et scellés.</li>
          <li><strong>Dossier Qualiopi continu</strong> — appréciations, réclamations et actions d'amélioration liées à leur cause.</li>
          <li><strong>Coffre et salle de formation</strong> — les pièces de chaque session, et le distanciel au même endroit.</li>
          <li><strong>Agents IA</strong> — sous identité vérifiée : ils lisent avec vos droits, jamais au-delà.</li>
        </ul>
        <p>Cette application nécessite JavaScript. <a href="https://vtlvs.com">Découvrir VTLVS</a> &middot; <a href="https://docs.vtlvs.com">Documentation</a> &middot; <a href="https://status.vtlvs.com">État des services</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
