# Grafana VTLVS — écoute locale, derrière Caddy et Cloudflare. Mot de passe admin : variable d'environnement.
[server]
http_addr = 127.0.0.1
http_port = 3300
domain = grafana.vtlvs.com
root_url = https://grafana.vtlvs.com/
enforce_domain = false

[security]
admin_user = admin
cookie_secure = true
cookie_samesite = strict
disable_gravatar = true
strict_transport_security = true
content_security_policy = true

[users]
allow_sign_up = false
allow_org_create = false
default_language = fr-FR

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
level = warn

[unified_alerting]
enabled = true
