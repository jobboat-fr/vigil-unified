# CI VTLVS — passerelle, application web, dépendances et secrets.
# Rien ne part en production sans que ces contrôles soient verts (branche protégée).
# Les actions sont épinglées par empreinte : une étiquette peut être déplacée, pas un commit.
name: VTLVS

on:
  push:
    branches: [main, feat/learn-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vtlvs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  passerelle:
    name: Passerelle — tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[product]" pytest pytest-asyncio ruff
      - name: Style (ruff)
        run: ruff check winny_gateway winny/council services/meeting_agent
      - name: Tests
        run: pytest -q tests/winny_gateway tests/meeting_agent

  application:
    name: Application web — types et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc -b web
      - name: Build (sans VITE_WW_GATEWAY_URL — voir deploy/cloudflare-app)
        run: npm run build --workspace web
      - name: Bordures — types et compilation
        run: |
          npx wrangler deploy --dry-run --outdir /tmp/api-edge --config deploy/cloudflare-api/wrangler.jsonc
          npx wrangler deploy --dry-run --outdir /tmp/app --config deploy/cloudflare-app/wrangler.jsonc

  dependances:
    name: Dépendances et secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      - name: Vulnérabilités Python (bloquant)
        run: |
          pip install pip-audit
          pip install -e ".[product]"
          pip-audit --ignore-vuln GHSA-4xh5-x5gv-qwph --skip-editable
      - name: Vulnérabilités npm (bloquant à partir de « high »)
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Secrets dans l'historique
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
